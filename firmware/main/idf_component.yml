# Managed dependencies for the `main` component.
#
# espressif/qrcode is here for the `qr` card type (tiny_display.cpp): the softAP
# provisioning portal has to show a scannable WIFI: code, and nothing in ESP-IDF
# v5.4, in vendor/, or on this machine can encode a QR offline (checked).
# Apache-2.0, zero dependencies, no target restrictions; it wraps
# nayuki/QR-Code-generator and hands back modules through a callback, which maps
# straight onto Canvas::fill_rect.
#
# Adding this file makes the component manager re-resolve firmware/dependencies.lock.
dependencies:
  espressif/qrcode: "^0.2.0"
  # ST7796S panel driver for the FNK0104S (lcd_panel_st7796.cpp). Pinned:
  # 1.5.0 is the version the vendor-init review was done against.
  espressif/esp_lcd_st7796: "==1.5.0"
  # ES8311 register control for the colour boards' audio (audio_es8311.cpp),
  # over the new i2c_master driver on the shared bus. Linked only where
  # referenced, so the reTerminal image does not carry it.
  espressif/esp_codec_dev: "==1.6.2"
