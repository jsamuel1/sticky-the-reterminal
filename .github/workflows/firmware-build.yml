# Firmware build: every push to main, every PR, and on demand.
#
# One job per board variant, all in the pinned espressif/idf:v5.4 image through
# tools/build_board.sh (the same entry point a laptop uses). Each job uploads a
# ready-to-flash devbench image set (manifest.json + parts) named
# devbench-<board>; tools/devbench/fetch_ci.sh pulls them into
# tools/devbench/images/ci-<board>/ so the bench flashes exactly what CI built.
# Public repository → standard runners cost no Actions minutes.
#
# On push to main, job ota-bench then pushes each board's app image to the
# owner's bench boards over the tiny.technology relay (tools/ota_push.py,
# AGENTS.md §10b). Secrets: TINY_TOKEN (user session JWT), TINY_BENCH_DEVICES
# ({"<board>":"<device id>"}). Missing secret or board entry = notice + skip.
name: firmware-build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PRs supersede themselves. main does not: a newer push must never cancel an
# ota-bench job between "ota sent" and "new fw_commit seen".
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        board: [reterminal, fnk0104s, amoled18]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4
      - name: build ${{ matrix.board }}
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          tools/build_board.sh ${{ matrix.board }}
      - name: refuse a dirty or unstamped build
        shell: bash
        run: |
          d=firmware/$([ ${{ matrix.board }} = reterminal ] && echo build || echo build-${{ matrix.board }})
          h="$d/esp-idf/main/gen/tiny_commit.h"
          cat "$h"
          ! grep -Eq -- '-dirty|nogit' "$h"
          # The uploaded app must carry this board's stamp (bench OTA's board
          # guard reads it): verdict ok, board = matrix board, project tiny_sticky.
          stamp=$(python3 tools/ota_push.py --inspect "$d/tiny_sticky.bin") || true
          echo "board stamp: $stamp"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); sys.exit(0 if (d["verdict"],d["board"],d["project"])==("ok",sys.argv[2],"tiny_sticky") else 1)' \
            "$stamp" "${{ matrix.board }}" \
            || { echo "::error::$d/tiny_sticky.bin is not stamped for ${{ matrix.board }}: $stamp"; exit 1; }
          echo "BUILD_DIR=$d" >> "$GITHUB_ENV"
      - name: devbench image set
        shell: bash
        run: |
          python3 tools/devbench/mkset.py "$BUILD_DIR" out/devbench-${{ matrix.board }} \
            --board ${{ matrix.board }} --note "CI run ${{ github.run_id }} on ${{ github.ref_name }}."
          ls -l out/devbench-${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: devbench-${{ matrix.board }}
          path: out/devbench-${{ matrix.board }}/
          retention-days: 30

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh

  # Which boards have a bench device, and is the token still good? Board names
  # only leave this job; the token and device ids stay in secrets.
  # main only, never a PR. workflow_dispatch on main counts: pushes to this
  # fork have not been starting runs (measured 2026-10-24, every main commit
  # so far ran by dispatch), and a dispatch on main builds main's tip.
  ota-plan:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.plan.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
          TINY_BENCH_DEVICES: ${{ secrets.TINY_BENCH_DEVICES }}
        run: |
          if [ -z "$TINY_TOKEN" ] || [ -z "$TINY_BENCH_DEVICES" ]; then
            echo "::notice::bench OTA skipped: TINY_TOKEN or TINY_BENCH_DEVICES secret not set"
            echo 'boards=[]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          days=$(python3 tools/ota_push.py --token-days)
          echo "TINY_TOKEN expires in $days days"
          if [ "$days" -lt 14 ]; then
            echo "::error::TINY_TOKEN (user session JWT) expires in $days days - run 'tiny-tech login' and 'gh secret set TINY_TOKEN' (AGENTS.md 10b)"
            exit 1
          fi
          boards=$(python3 -c 'import json,os; m=json.loads(os.environ["TINY_BENCH_DEVICES"]); print(json.dumps(sorted(b for b in ("reterminal","fnk0104s","amoled18") if m.get(b))))') \
            || { echo "::error::TINY_BENCH_DEVICES is not a JSON object"; exit 1; }
          for b in reterminal fnk0104s amoled18; do
            case "$boards" in *"\"$b\""*) ;; *) echo "::notice::bench OTA: no TINY_BENCH_DEVICES entry for $b - skipped";; esac
          done
          echo "boards=$boards" >> "$GITHUB_OUTPUT"

  ota-bench:
    needs: [build, host-tests, ota-plan]
    if: needs.ota-plan.outputs.boards != '[]' && needs.ota-plan.outputs.boards != ''
    concurrency:
      group: ota-bench
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        board: ${{ fromJSON(needs.ota-plan.outputs.boards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ancestry check against the on-glass fw_commit
      - uses: actions/download-artifact@v4
        with:
          name: devbench-${{ matrix.board }}
          path: img
      - name: push ${{ matrix.board }}
        shell: bash
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
          TINY_BENCH_DEVICES: ${{ secrets.TINY_BENCH_DEVICES }}
          BOARD: ${{ matrix.board }}
        run: |
          export TINY_DEVICE=$(python3 -c 'import json,os; print(json.loads(os.environ["TINY_BENCH_DEVICES"]).get(os.environ["BOARD"],""))')
          unset TINY_BENCH_DEVICES
          [ -n "$TINY_DEVICE" ] || { echo "::notice::no bench device for $BOARD"; exit 0; }
          python3 tools/ota_push.py --board "$BOARD" --sha "$GITHUB_SHA" --image img/tiny_sticky.bin
